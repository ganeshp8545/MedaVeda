<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MedVeda - Reset Password</title>
<style>
  :root {
    --brand: #2E7D32;
    --brand-dark: #1B5E20;
    --bg: #0F1712;
    --card: #16201A;
    --text: #EAF5EC;
    --subtitle: #9FB8A6;
    --error: #E5484D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, Roboto, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  .logo { font-size: 56px; margin-bottom: 8px; }
  h1 {
    color: var(--text);
    font-size: 24px;
    margin: 0 0 8px;
  }
  p {
    color: var(--subtitle);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .btn {
    display: block;
    width: 100%;
    background: var(--brand);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 20px;
    border-radius: 10px;
    margin-bottom: 12px;
    border: none;
    cursor: pointer;
  }
  .btn:active { background: var(--brand-dark); }
  .hint {
    font-size: 13px;
    color: var(--subtitle);
    margin-top: 16px;
  }
  .error-box {
    background: rgba(229,72,77,0.12);
    border: 1px solid var(--error);
    color: #FCA5A5;
    border-radius: 10px;
    padding: 14px;
    font-size: 14px;
    margin-bottom: 20px;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🌿</div>
    <h1>MedVeda</h1>
    <div id="content">
      <p>Preparing your password reset link…</p>
    </div>
  </div>

<script>
  // Supabase's /auth/v1/verify redirects here with the recovery session
  // as a URL fragment: #access_token=...&refresh_token=...&type=recovery
  // (or #error=...&error_description=... if the link was expired/used).
  //
  // WHY THIS PAGE EXISTS: Supabase's redirect_to was previously set
  // directly to "ayurpulse://reset-password". When the email link is
  // opened from inside Gmail's own embedded in-app browser, that final
  // hop (https -> custom scheme) happens as a *programmatic* redirect,
  // which Gmail's webview silently swallows for security reasons -
  // nothing opens, and the already-running app just resumes to whatever
  // screen it was on, with no token ever reaching the app.
  //
  // Fix: land on this real https page first (https->https redirects
  // always work, even in embedded webviews), then hand the token to the
  // app via a real, user-initiated tap on an <a href="ayurpulse://...">
  // link. A genuine tap is far more reliably honoured by mobile webviews
  // than an automatic redirect to a non-http(s) scheme.
  const hash = window.location.hash.startsWith("#")
    ? window.location.hash.slice(1)
    : window.location.hash;
  const params = new URLSearchParams(hash);

  const errorDescription = params.get("error_description");
  const accessToken = params.get("access_token");
  const refreshToken = params.get("refresh_token");
  const type = params.get("type");

  const content = document.getElementById("content");

  function renderError(message) {
    content.innerHTML =
      '<div class="error-box">' + message + "</div>" +
      '<a class="btn" href="ayurpulse://reset-password">Open MedVeda App</a>' +
      '<p class="hint">You can request a new reset link from the app\'s Login screen.</p>';
  }

  function renderOpenApp(appUrl) {
    content.innerHTML =
      "<p>Tap below to finish resetting your password in the MedVeda app.</p>" +
      '<a class="btn" id="openAppBtn" href="' + appUrl + '">Open MedVeda App</a>' +
      '<p class="hint">If nothing happens, make sure MedVeda is installed, then tap the button above again.</p>';

    // Best-effort auto attempt (works on plain browsers; harmless no-op
    // if the embedded webview blocks it - the visible button above is
    // the reliable fallback either way).
    window.location.href = appUrl;
  }

  if (errorDescription) {
    renderError(errorDescription.replace(/\+/g, " "));
  } else if (type === "recovery" && accessToken && refreshToken) {
    const appUrl =
      "ayurpulse://reset-password#access_token=" + encodeURIComponent(accessToken) +
      "&refresh_token=" + encodeURIComponent(refreshToken) +
      "&type=recovery";
    renderOpenApp(appUrl);
  } else {
    renderError("This reset link is invalid or has expired. Please request a new one from the app.");
  }
</script>
</body>
</html>
