name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  admin-panel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin-panel } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-panel/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - run: npm audit --omit=dev --audit-level=high

  mobile-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile-app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types scripts/checkout-html-selftest.mjs
      - run: node scripts/verify-signature-selftest.js

  website:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build.mjs
      - run: node scripts/check-links.mjs

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: |
          for f in supabase/functions/*/index.ts; do deno check "$f"; done

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Build a database from the migrations and run every SQL suite + the webhook harness
        run: PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=ci supabase/tests/run-all.sh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real keys in the repo
        run: |
          ! git grep -nEI '(rzp_live_[A-Za-z0-9]{10,}|sk_live_|-----BEGIN (RSA |EC )?PRIVATE KEY-----|service_role[^\n]{0,20}eyJ)' -- . ':!docs' ':!*.md' ':!*.env.example' ':!.github'
