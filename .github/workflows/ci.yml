name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tooling/package-lock.json }
      - run: npm ci --prefix tooling
      - run: npm run lint --prefix tooling

  admin-panel:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin-panel } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-panel/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  mobile-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile-app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types scripts/checkout-html-selftest.mjs
      - run: node --experimental-strip-types scripts/password-policy-selftest.mjs
      - run: node scripts/verify-signature-selftest.js
      - run: node scripts/same-project-build-selftest.cjs
      - run: node scripts/staging-build-selftest.cjs
      - run: node scripts/payment-provider-selftest.cjs
      - run: node scripts/payment-routing-selftest.cjs
      - run: node scripts/play-restore-selftest.cjs
      - run: node scripts/play-lifecycle-selftest.cjs
      - run: node scripts/offline-download-selftest.cjs
      - run: node scripts/offline-owner-selftest.cjs
      - run: node scripts/quiz-hooks-selftest.cjs
      - run: node scripts/purchases-selftest.cjs
      - run: npm audit --omit=dev --audit-level=high

  website:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: website } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build.mjs
      - run: node scripts/check-links.mjs

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: |
          for f in supabase/functions/*/index.ts; do deno check "$f"; done
          deno check supabase/workers/validate-note-pdf.ts
          deno test --allow-env supabase/tests/quarantine-worker-test.ts supabase/tests/upload-note-pdf-test.ts supabase/tests/play_catalog_unit_test.ts supabase/tests/play_catalog_api_test.ts

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Build a database from the migrations and run every SQL suite + the webhook harness
        run: PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=ci supabase/tests/run-all.sh

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/secret-scan-selftest.mjs
      - name: No real keys in the repo
        run: git ls-files -z | node scripts/scan-secrets.mjs --stdin
