# Edge-function JWT settings, explicit so a redeploy can never silently change them.
#
#  verify_jwt = true   create-order, get-note-url, get-video-url, delete-account: only ever act on
#                      the user identified by the verified token (never a body field).
#  verify_jwt = false  functions that legitimately run without a Supabase session, each with its own
#                      authentication:
#                        verify-payment ............ Razorpay HMAC signature / Razorpay's own API
#                                                    (released app builds send no JWT); rate limited
#                        razorpay-webhook .......... raw-body HMAC signature
#                        login-with-mobile,
#                        request-password-reset-by-mobile
#                                                    run before sign-in; password checked by Supabase Auth
#                        send-push-notification .... called from the admin panel's browser: a gateway-level
#                                                    401 would carry no CORS headers, so the function checks
#                                                    the JWT and public.admins itself
#
# `pay` and `create-payment-session` were removed (create-order replaced them).

[functions.create-order]
verify_jwt = true

[functions.create-play-order]
verify_jwt = true

[functions.verify-play-purchase]
verify_jwt = true

[functions.attach-external-token]
verify_jwt = true

# Authenticated by UCB_REPORT_CRON_SECRET in x-ucb-cron-secret, not a user JWT.
[functions.report-external-transaction]
verify_jwt = false

# Server cron only. The function checks PLAY_PAYMENT_CRON_SECRET in
# x-play-payment-cron-secret; callers do not have a user JWT.
[functions.play-payment-worker]
verify_jwt = false

[functions.get-note-url]
verify_jwt = true

[functions.get-video-url]
verify_jwt = true

# verify-payment carries no Supabase JWT: it authenticates the Razorpay
# callback by HMAC signature and re-confirms with Razorpay's API.
[functions.verify-payment]
verify_jwt = false

# Razorpay cannot attach a Supabase JWT to a webhook. This endpoint instead
# authenticates every request with its raw-body HMAC signature.
[functions.razorpay-webhook]
verify_jwt = false

# Admin panel's Send Notification feature. See the rationale in the
# header comment above - browser-invoked + CORS preflight is why this
# needs to be off even though (unlike pay/verify-payment) it does send
# an Authorization header.
[functions.send-push-notification]
verify_jwt = false

# Student-initiated account deletion. JWT verification stays ON: the function
# only ever acts on the user identified by the verified token (never the body),
# and the app always sends the Authorization header. Explicit so a redeploy
# cannot silently change it.
[functions.delete-account]
verify_jwt = true

# Mobile-number sign-in and password reset. Both run BEFORE the user has a
# session (the app sends only its public anon key), so JWT verification must be
# off. They authenticate by other means: login-with-mobile verifies the password
# through Supabase Auth; request-password-reset-by-mobile only ever sends a
# reset email to the account's own address and always answers { ok: true }.
[functions.login-with-mobile]
verify_jwt = false

[functions.request-password-reset-by-mobile]
verify_jwt = false

# Auth password policy. Supabase Auth (GoTrue) enforces this on EVERY path that sets a
# password (signUp, updateUser, recovery, admin API), so a direct API call cannot bypass
# the app's client-side form. Only the properties declared here are pushed by
# `supabase config push`; run `supabase config diff` first and review it.
# NOT expressible in Supabase: a maximum length (GoTrue only caps at bcrypt's 72 bytes).
# The 32-character maximum therefore stays a client-side rule (docs/security/PASSWORD_POLICY.md).
# Leaked-password (HIBP) protection is a Pro-plan dashboard toggle, not a config.toml key.
[auth]
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"
